<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SealGauge · 封边照片台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='sealgauge.css') }}">
  <script defer src="{{ url_for('static', filename='sealgauge.js') }}"></script>
</head>
<body>
<header class="masthead">
  <a class="brand" href="/"><i aria-hidden="true"></i> SealGauge</a>
  <span class="mast-label">封边照片台</span>
  <a class="external" href="/prepare">照片准备 ↗</a>
</header>
<main>
  <section class="introduction">
    <div><h1>包装样条封边测量</h1><p>从空包装样条原照圈定封边，核查压痕截宽和沿边各列实测分布。</p></div>
    <div class="top-actions">
      <button id="practice" class="primary" type="button">打开练习封边</button>
      <button id="open-import" type="button">导入原片</button>
    </div>
  </section>
  <p id="notice" class="notice" role="status" hidden></p>
  <section class="library">
    <label for="library">封边卡</label>
    <select id="library"><option value="">选取已存卡片</option></select>
    <span id="origin"></span>
  </section>
  <section id="empty" class="empty">
    <div class="empty-seam" aria-hidden="true"><i></i></div>
    <h2>选择一张封边原照</h2>
    <p>使用正拍样条，将封痕的上下两侧放在测量框内。</p>
  </section>
  <section id="workspace" class="workspace" hidden>
    <div class="left">
      <section class="panel source">
        <div class="panel-head">
          <div><h2 id="card-title">原片</h2><span id="dimensions"></span></div>
          <div class="modes" role="group" aria-label="原片封边模式">
            <button id="probe-mode" data-mode="probe" aria-pressed="true" type="button">点读</button>
            <button id="mark-mode" data-mode="mark" aria-pressed="false" type="button">取截线</button>
          </div>
        </div>
        <div class="camera"><canvas id="capture" aria-label="封边原照，可点击取样或输入原片像素坐标"></canvas></div>
        <div class="probe">
          <b>原片点读</b>
          <form id="probe-form"><label>X <input id="probe-x" type="number" min="0" step="1" required></label>
            <label>Y <input id="probe-y" type="number" min="0" step="1" required></label>
            <button type="submit">读取</button></form>
          <span id="probe-result">选择原片像素</span>
        </div>
      </section>
      <section class="panel segment" hidden>
        <div class="panel-head">
          <div><h2>留段给同事</h2><span>只用框内相邻完整原列；暗点不相连，含 0/255 削幅像素的列不能凑宽</span></div>
        </div>
        <form id="segment-form" class="segment-controls">
          <label>要留的长度 mm<input id="seg-length" type="number" min="0.001" step="any" required></label>
          <label>最小暗压痕宽 mm<input id="seg-width" type="number" min="0.001" step="any" required></label>
          <button class="primary" type="submit">规划留段</button>
        </form>
        <p id="segment-summary" class="segment-summary" role="status"></p>
        <div id="segment-candidates" class="segment-candidates"></div>
        <div class="segment-actions">
          <button id="seg-preview" type="button" disabled>查看实际左右边</button>
          <button id="seg-send" class="primary" type="button" disabled>裁帧送入照片准备 ↗</button>
        </div>
      </section>
      <section class="panel profile">
        <div class="panel-head">
          <div><h2 id="chart-title">截线实测亮度</h2><span id="chart-caption">当前截线 · 原片 Y</span></div>
          <div class="modes" role="group" aria-label="当前图表">
            <button data-chart="profile" aria-pressed="true" type="button">单列截面</button>
            <button data-chart="coverage" aria-pressed="false" type="button">沿封边</button>
          </div>
        </div>
        <canvas id="chart" width="850" height="166" aria-label="单列实拍截面或沿封边压痕分布"></canvas>
      </section>
    </div>
    <aside class="right">
      <section class="panel readout">
        <div class="panel-head"><h2>当前连续压痕宽</h2><span id="measurement-state"></span></div>
        <div class="volume"><strong id="width-value">—</strong><span id="width-unit"></span></div>
        <p id="selected-level"></p>
      </section>
      <form id="calibration" class="panel settings">
        <div class="panel-head"><div><h2>测量框和标尺</h2><span>坐标使用原片像素，X 向右，Y 向下</span></div></div>
        <label class="wide">卡片名称<input id="name" maxlength="80" required></label>
        <fieldset><legend>原片测量框 · px</legend><div class="form-grid">
          <label>左界 X<input data-setting="left" type="number" step="1" min="0" required></label>
          <label>右界 X<input data-setting="right" type="number" step="1" min="0" required></label>
          <label>截线 X<input data-setting="focus" type="number" step="1" min="0" required></label>
          <label>上界 Y<input data-setting="top" type="number" step="1" min="0" required></label>
          <label>下界 Y<input data-setting="bottom" type="number" step="1" min="0" required></label>
        </div></fieldset>
        <fieldset><legend>压痕和比例</legend><div class="form-grid">
          <label>压痕亮度上限<input data-setting="cutoff" type="number" step="1" min="1" max="254" required></label>
          <label>标尺 mm/px<input data-setting="mm_per_px" type="number" step="any" min="0.001" required></label>
        </div></fieldset>
        <button id="save" class="primary" type="submit">保存并测量</button>
      </form>
      <section class="panel outputs">
        <div class="panel-head"><h2>封边交接</h2></div>
        <div><a id="proof" download>PNG 校样 ↓</a><a id="csv" download>CSV 读数 ↓</a><a id="zip" download>ZIP 封边卡 ↓</a></div>
        <button id="prepare" type="button">将原片送入照片准备 ↗</button>
      </section>
    </aside>
  </section>
</main>
<dialog id="import">
  <form id="upload">
    <h2>导入封边原照</h2>
    <label>封边卡名称<input name="name" maxlength="80" required></label>
    <label>照片<input name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" required></label>
    <p id="import-notice" role="status"></p>
    <div class="top-actions"><button id="cancel-import" type="button">取消</button><button class="primary" type="submit">建立封边卡</button></div>
  </form>
</dialog>
<dialog id="segment-dialog">
  <form method="dialog" class="segment-dialog-form">
    <h2>留段实际左右边 · 原像素</h2>
    <p id="segment-dialog-meta"></p>
    <div class="segment-preview-box"><img id="segment-preview-img" alt="留段原像素预览"></div>
    <div class="top-actions"><button class="primary" value="close">回到规划</button></div>
  </form>
</dialog>
</body>
</html>
